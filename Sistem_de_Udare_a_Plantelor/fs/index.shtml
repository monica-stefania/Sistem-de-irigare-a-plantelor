<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistem de Udare a Plantelor</title>

        <style>
        body {
            font-family: 'Segoe UI', Verdana, sans-serif, sans-serif;
            background-color: #1e272e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #485460;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.5);
        }

        h1 { 
            color: #0fbcf9; 
            font-size: 24px; 
        }

        .data-box {
            background-color: #1e272e;
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 20px;
        }
        .highlight { 
            color: #0be881; 
            font-weight: bold; 
            font-size: 28px; 
        }
        
        /* Design pentru butoane */
        a{
            display: inline-block;
            width: 80%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-start { 
            background-color: #05c46b; 
        }
        .btn-start:hover { 
            background-color: #048f4e;
        }
        .btn-stop {
             background-color: #ff3f34; 
        }
        .btn-stop:hover { 
            background-color: #b32a22;
        }
    </style>
    </head>
    <body>
        <div class="container">
        <h1>Smart Garden Dashboard</h1>
        
        <div class="data-box">
            Umiditate sol: <br>
            <span class="highlight">%</span>
        </div>

        <div class="data-box">
            Status: <strong></strong><br>
            <span style="font-size: 14px; color: #808e9b;">Activ de: </span>
        </div>

        <a href="/irigate?state=1" class="btn-start">PORNEȘTE UDAREA</a>
        <a href="/irigate?state=0" class="btn-stop">OPREȘTE UDAREA</a>
    </div>
    </body>
</html>
